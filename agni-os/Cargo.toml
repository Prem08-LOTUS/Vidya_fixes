[package]
name = "agnix"
version = "0.4.6"
edition = "2021"

[features]
default = ["ui", "serial"]
ui = ["tauri", "tauri-build"]
serial = ["serialport", "tokio-serial"]

[dependencies]
# SECURITY FIX: RUSTSEC-2025-0020
pyo3 = { version = "0.23.1", features = ["auto-initialize"] }

# SECURITY FIX: RUSTSEC-2023-0071
rsa = "0.9.6"

# STABILITY FIXES
tokio = { version = "1.36", features = ["full"] }
tracing-subscriber = "0.3.18"
tracing-appender = "0.2"

serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
nalgebra = { version = "=0.32.3", features = ["serde-serialize"] }
bitflags = "=2.4.1"
chrono = { version = "0.4.34", features = ["serde"] }
anyhow = "=1.0.75"
thiserror = "1.0"
tracing = "=0.1.40"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "uuid", "chrono"] }
ndarray = "0.15"
geo = "0.27"
lyon = "1.0"
log = "0.4"
rand = "=0.8.5"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.7", features = ["serde", "v4"] }
futures = "0.3"

# Hardware Dependencies (Optional)
serialport = { version = "4.3", optional = true }
tokio-serial = { version = "=5.4.4", optional = true }

# UI Dependencies (Optional)
tauri = { version = "1.5", optional = true, features = ["api-all"] }
regex = "1.12.2"
byteorder = "1.5.0"
toml = "0.9.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.10"
tokio-test = "0.4"
approx = "0.5"
proptest = "=1.4.0"
# kani = "0.39" # Kani is usually run via cargo-kani, not as a dep unless using kani crate

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[build-dependencies]
tauri-build = { version = "1.5", optional = true }

[[bench]]
name = "bench_allocation"
harness = false
